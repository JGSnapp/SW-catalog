services:
  agent_server:
    build:
      context: ./agent_server
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-stroky}:${POSTGRES_PASSWORD:-stroky}@postgres:5432/${POSTGRES_DB:-stroky}
      OPENAI_AGENTS_DISABLE_TRACING: "1"
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      agent_server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      
  nginx:
    build: ./nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - agent_server
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/certbot:/var/www/certbot:ro
    environment:
      - NGINX_HOST=strok1.ru
      - NGINX_PORT=80
      - NGINX_SSL_PORT=443

  postgres:
    image: ankane/pgvector
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stroky}
      POSTGRES_USER: ${POSTGRES_USER:-stroky}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stroky}
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-8080}:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin


volumes:
  pgdata:
  pgadmin_data:
  uploads_data:
  logs_data:
